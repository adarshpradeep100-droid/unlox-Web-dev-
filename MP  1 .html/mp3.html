<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather and Movie Search</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        header {
            text-align: center;
            background: white;
            padding: 30px 15px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #666;
        }

        main {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .app {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .app h2 {
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #2878d4;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d5fa8;
        }

        .result {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 8px;
            min-height: 80px;
        }

        .temperature {
            font-size: 35px;
            font-weight: bold;
            margin: 10px 0;
        }

        .weather-card p {
            margin: 8px 0;
        }

        .movie-card {
            display: flex;
            gap: 20px;
        }

        .movie-card img {
            width: 170px;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
        }

        .movie-info {
            flex: 1;
        }

        .movie-info h3 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .movie-info p {
            margin: 9px 0;
            line-height: 1.5;
        }

        .error {
            color: #d62828;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .movie-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .movie-card img {
                width: 160px;
                height: 230px;
            }
        }

    </style>
</head>


<body>

    <header>

        <h1>Weather and Movie Search</h1>

        <p>
            Search for weather information and movies
        </p>

    </header>


    <main>

        <!-- WEATHER APP -->

        <section class="app">

            <h2>🌤️ Weather App</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                >

                <button onclick="getWeather()">
                    Search
                </button>

            </div>

            <div id="weatherResult" class="result">

                <p>
                    Enter a city name to check the weather.
                </p>

            </div>

        </section>


        <!-- MOVIE SEARCH APP -->

        <section class="app">

            <h2>🎬 Movie Search App</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="movieInput"
                    placeholder="Enter movie name"
                >

                <button onclick="searchMovie()">
                    Search
                </button>

            </div>

            <div id="movieResult" class="result">

                <p>
                    Enter a movie name to search.
                </p>

            </div>

        </section>

    </main>


    <script>

        // API Keys

        const WEATHER_API_KEY = "abc123xyz";
        const MOVIE_API_KEY = "987xyzabc";


        // WEATHER APP

        const getWeather = async () => {

            const city =
                document.getElementById("cityInput").value.trim();

            const result =
                document.getElementById("weatherResult");


            if (!city) {

                result.innerHTML =
                    `<p class="error">
                        Please enter a city name.
                    </p>`;

                return;
            }


            result.innerHTML =
                "<p>Loading weather...</p>";


            try {

                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${WEATHER_API_KEY}&units=metric`
                );


                if (!response.ok) {

                    throw new Error("City not found");

                }


                const data = await response.json();


                const {
                    name,
                    main: { temp, humidity },
                    weather,
                    wind: { speed }
                } = data;


                result.innerHTML = `

                    <div class="weather-card">

                        <h3>${name}</h3>

                        <div class="temperature">
                            ${Math.round(temp)}°C
                        </div>

                        <p>
                            <strong>Condition:</strong>
                            ${weather[0].description}
                        </p>

                        <p>
                            <strong>Humidity:</strong>
                            ${humidity}%
                        </p>

                        <p>
                            <strong>Wind Speed:</strong>
                            ${speed} m/s
                        </p>

                    </div>

                `;

            }

            catch (error) {

                result.innerHTML = `

                    <p class="error">
                        ${error.message}.
                        Please check the city name.
                    </p>

                `;

            }

        };


        // MOVIE SEARCH APP

        const searchMovie = async () => {

            const movieName =
                document.getElementById("movieInput").value.trim();

            const result =
                document.getElementById("movieResult");


            if (!movieName) {

                result.innerHTML =
                    `<p class="error">
                        Please enter a movie name.
                    </p>`;

                return;
            }


            result.innerHTML =
                "<p>Searching for movie...</p>";


            try {

                const response = await fetch(
                    `https://www.omdbapi.com/?apikey=${MOVIE_API_KEY}&t=${movieName}`
                );


                if (!response.ok) {

                    throw new Error("Unable to search movie");

                }


                const data = await response.json();


                if (data.Response === "False") {

                    throw new Error(data.Error);

                }


                const {
                    Title,
                    Poster,
                    Year,
                    Genre,
                    Plot,
                    imdbRating
                } = data;


                const poster =
                    Poster !== "N/A"
                        ? Poster
                        : "https://via.placeholder.com/170x250?text=No+Poster";


                result.innerHTML = `

                    <div class="movie-card">

                        <img
                            src="${poster}"
                            alt="${Title}"
                        >

                        <div class="movie-info">

                            <h3>${Title}</h3>

                            <p>
                                <strong>Release Year:</strong>
                                ${Year}
                            </p>

                            <p>
                                <strong>Genre:</strong>
                                ${Genre}
                            </p>

                            <p>
                                <strong>Rating:</strong>
                                ⭐ ${imdbRating}
                            </p>

                            <p>
                                <strong>Plot:</strong>
                                ${Plot}
                            </p>

                        </div>

                    </div>

                `;

            }

            catch (error) {

                result.innerHTML = `

                    <p class="error">
                        ${error.message}
                    </p>

                `;

            }

        };


        // ENTER KEY SUPPORT

        document
            .getElementById("cityInput")
            .addEventListener("keydown", (event) => {

                if (event.key === "Enter") {

                    getWeather();

                }

            });


        document
            .getElementById("movieInput")
            .addEventListener("keydown", (event) => {

                if (event.key === "Enter") {

                    searchMovie();

                }

            });

    </script>

</body>

</html>
